GROQ_BASE_URL: "https://api.groq.com/openai/v1"

# Model for fast tasks (classify, clarify)
GROQ_MODEL_FAST: "llama-3.1-8b-instant"

# Model for heavy tasks (planning, game generation)
GROQ_MODEL_POWER: "openai/gpt-oss-20b"

# Backend URL (used by Streamlit frontend)
BACKEND_URL: "http://localhost:8000"

# Directory to save generated game files
OUTPUT_DIR: "output"